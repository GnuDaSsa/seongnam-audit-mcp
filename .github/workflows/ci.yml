name: 감사 MCP 회귀 검증
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 공개 저장소 파일 범위 확인
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath
          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          blocked = []
          for raw in filter(None, files):
              path = PurePosixPath(os.fsdecode(raw))
              if (set(path.parts) & {"originals", "snapshot", "model", ".work"}
                      or path.suffix.lower() in {".pdf", ".hwp", ".hwpx", ".safetensors", ".onnx"}
                      or path.name.startswith(".env") and path.name != ".env.example"):
                  blocked.append(str(path))
          if blocked:
              raise SystemExit("공개 커밋 제외 대상 파일 발견: " + ", ".join(blocked))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: HTML·PDF 원문 추출 라이브러리 설치
        run: python -m pip install -r requirements.txt
      - name: 고정 버전의 공식 MCP 테스트 클라이언트 설치
        run: npm ci --ignore-scripts --no-audit
      - name: 원문 PDF와 차단 안내문 구분
        run: python -m unittest discover -s tests -p test_report_source.py
      - name: 합성 자료로 검색·최종 검증·MCP 프로토콜 검사
        run: npm run test:ci
      - name: 독립 답변과 채점표 지문 대조
        run: |
          node answer-benchmark.mjs --check-freeze
          node answer-benchmark.mjs --suite final-v1 --check-freeze
