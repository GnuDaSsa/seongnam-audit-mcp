name: 원문·수록 범위
description: 공식 감사자료의 누락, 첨부 접근 실패, 잘못된 출처·연도·기관·사례 경계를 제보합니다.
title: "[원문·수록 범위] "
body:
  - type: markdown
    attributes:
      value: "공식 공개 문서나 게시물의 링크를 적어 주세요. 비공개 첨부와 개인정보가 포함된 캡처는 받지 않습니다."
  - type: input
    id: official-url
    attributes:
      label: 공식 공개 출처 URL
      description: 해당 기관의 감사 게시물, 원문, 또는 공개 목록 주소입니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 기관·연도·자료명과 위치
      description: 해당 쪽, 처분요구서 번호나 게시물 본문, 영향을 받는 검색 범위를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: 확인한 상태
      description: 어떤 자료가 빠졌거나 다르게 표시되는지 적어 주세요. 접근 안내문이 보이면 공개 가능한 내용만 요약해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 해결을 확인할 방법
      description: 다시 열어 볼 원문 위치, 기대한 근거, 또는 수록 보류 사유와 범위 표시를 적어 주세요.
    validations:
      required: true
