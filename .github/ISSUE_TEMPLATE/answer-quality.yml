name: 답변·검색 품질
description: 무관한 검색 결과, 빠진 사례, 원문과 맞지 않는 인용 또는 최종 답변을 제보합니다.
title: "[답변 품질] "
body:
  - type: markdown
    attributes:
      value: "이슈는 공개됩니다. 실제 내부 문서나 개인 정보는 올리지 말고, 상황을 다시 만든 예시와 공개 출처만 적어 주세요."
  - type: textarea
    id: question
    attributes:
      label: 재현할 질문과 조건
      description: 가상의 업무 질문, 지정한 기관·감사 연도·분야를 적어 주세요.
      placeholder: 직원 격려 물품을 구입한 뒤 자체계획을 세웠습니다. 성남시청소년재단의 2018년 사례가 있나요?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 실제 결과
      description: 문제가 발생한 도구 또는 최종 답변과 결과를 짧게 적어 주세요. 사건 ID, 원문 위치, 서버 버전을 알면 함께 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대하는 결과와 공개 근거
      description: 어떤 결과가 맞는지, 원문 링크·쪽·관련 문구 또는 결과를 보류할 이유를 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 재현 위치
      options:
        - 로컬 MCP
        - 공개 MCP
        - MCP를 사용한 채팅 앱의 최종 답변
        - 확인 필요
    validations:
      required: true
